name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
      - name: Check import
        run: python -c "import confusion_mapper; print('Import OK')"

  python39:
    # Python 3.9 reached end of life in October 2025. On 13 November 2026 the
    # hosted runner stopped installing it through setup-python (the same job
    # passed that morning and failed at the install step that afternoon). The
    # package still promises 3.9, so 3.9 is tested in the official Docker image.
    name: Python 3.9 (official Docker image)
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
      - name: Check import
        run: python -c "import confusion_mapper; print('Import OK')"

  everything:
    # The matrix above runs on a bare Python. This job adds what the optional
    # tests need (scipy for the cross-checks, Node and jsdom for the teacher
    # page, Pyodide for the agreement page) and fails if even one test is
    # skipped, so nothing hides.
    name: Every test, nothing skipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" numpy scipy
          npm install --no-save jsdom@24 pyodide@0.26.1
      - name: Run every test
        shell: bash
        run: python -m pytest tests/ -q -rs | tee pytest.log
      - name: Fail on skipped tests
        shell: bash
        run: |
          if grep -q "skipped" pytest.log; then
            echo "Some tests were skipped. Every test should run in this job."
            exit 1
          fi
      - name: Walk through the teacher page in English and Hindi
        run: node worksheets/check_page.js worksheets/index.html

